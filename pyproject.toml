[project]
name = "seeker-bot"
version = "0.1.0"
description = "Agente pessoal em janela, só com modelos online."
requires-python = ">=3.12"
dependencies = ["groq>=0.9.0", "httpx>=0.27", "imageio-ffmpeg>=0.5.1", "kokoro>=0.9.4", "mcp>=2", "numpy>=2.0", "pillow>=10.0", "psutil>=6.0", "pystray>=0.19", "pywebview>=5.0", "soundfile>=0.12", "torch>=2.6", "torchaudio>=2.6", "tzdata>=2024.1", "winotify>=1.1", "yt-dlp>=2024.8.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seeker*"]

[tool.setuptools.package-data]
seeker = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
